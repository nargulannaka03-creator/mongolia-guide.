<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>DIT Mongolia Guide</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Antique&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap">
<style>
/* Layout: 国旗の三色帯を背に、まず言語の二択。選ぶとその言語の4冊が本棚のように並び、開くと全画面のビューアに */
:root{
  --bg:#f2f4f8;
  --surface:#ffffff;
  --ink:#172033;
  --muted:#5a6476;
  --line:#d5dbe5;
  --red:#c8322f;     /* 国旗の赤 */
  --blue:#1f4f9c;    /* 国旗の青 */
  --gold:#d6a23a;    /* ソヨンボの金 */
  --on-dark:#f4f6fa;
  --f-display:"Zen Antique","Hiragino Mincho ProN","Yu Mincho",Georgia,serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-label:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e131c;--surface:#161d29;--ink:#e8ecf3;--muted:#a0aabb;--line:#2a3344;
  --red:#e2615a;--blue:#6f9be0;--gold:#e3b75e;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e131c;--surface:#161d29;--ink:#e8ecf3;--muted:#a0aabb;--line:#2a3344;
  --red:#e2615a;--blue:#6f9be0;--gold:#e3b75e;color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.75}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.3;margin:0;text-wrap:balance}
p{margin:0}
.lbl{font-family:var(--f-label);font-size:.76rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

/* flag band */
.band{display:grid;grid-template-columns:1fr 1fr 1fr;height:10px}
.band i:nth-child(1),.band i:nth-child(3){background:var(--red)}
.band i:nth-child(2){background:var(--blue)}

/* landing */
.landing .wrap{padding-block:64px 56px;display:grid;gap:36px;justify-items:center;text-align:center}
.mark{width:72px;height:72px}
.mark .g{fill:var(--gold)}
.landing h1{font-size:clamp(2.2rem,7vw,4.2rem)}
.landing h1 small{display:block;font-family:var(--f-label);font-weight:500;font-size:.32em;letter-spacing:.2em;color:var(--muted);margin-top:8px}
.choose{display:grid;grid-template-columns:repeat(2,minmax(0,260px));gap:16px;width:100%;justify-content:center}
.lang{display:grid;gap:4px;padding:28px 20px;border-radius:14px;border:2px solid var(--line);background:var(--surface);cursor:pointer;text-align:center;transition:border-color .2s,transform .2s}
.lang:hover{border-color:var(--blue);transform:translateY(-2px)}
.lang b{font-family:var(--f-display);font-weight:400;font-size:2rem}
.lang span{font-size:.85rem;color:var(--muted)}
.landing p.hint{color:var(--muted);font-size:.92rem}

/* menu */
.menu .wrap{padding-block:36px 56px;display:grid;gap:28px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.home{background:none;border:0;cursor:pointer;font-family:var(--f-display);font-size:1.15rem;padding:6px 0;min-height:44px}
.switch{display:flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden}
.switch button{background:var(--surface);border:0;padding:8px 18px;cursor:pointer;font-weight:700;font-size:.9rem;min-height:40px}
.switch button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.menu h2{font-size:clamp(1.7rem,4.6vw,2.6rem)}
.menu .intro{color:var(--muted);max-width:36em;margin-top:6px}
.books{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.book{display:grid;grid-template-columns:96px minmax(0,1fr);gap:0;text-align:left;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);cursor:pointer;padding:0;transition:border-color .2s,transform .2s}
.book:hover{border-color:var(--ink);transform:translateY(-2px)}
.spine{display:grid;place-items:center;color:var(--on-dark);font-family:var(--f-display);font-size:2.4rem}
.spine.s1{background:var(--blue)}.spine.s2{background:#20242c}.spine.s3{background:var(--red)}.spine.s4{background:#9a6a1c}
.book .txt{padding:18px 20px 20px;display:grid;gap:6px;align-content:start;min-width:0}
.book .txt .lbl{color:var(--blue)}
.book h3{font-size:1.35rem}
.book p{font-size:.92rem;color:var(--muted)}
.book .open{font-family:var(--f-label);font-weight:600;font-size:.82rem;letter-spacing:.08em;color:var(--ink);margin-top:4px}

/* viewer */
.viewer{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column}
.vbar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top,0px);padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.vbar .back{display:flex;align-items:center;gap:6px;background:none;border:0;cursor:pointer;font-weight:700;padding:10px 4px;min-height:48px}
.vbar .vtitle{font-family:var(--f-display);font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1;text-align:center}
.vbar .vswitch{background:var(--bg);border:1.5px solid var(--line);border-radius:999px;cursor:pointer;font-weight:700;font-size:.85rem;padding:6px 14px;min-height:38px;white-space:nowrap}
.viewer iframe{flex:1;width:100%;border:0;display:block;background:var(--bg)}
.vfoot{height:env(safe-area-inset-bottom,0px);background:var(--surface)}

footer .wrap{padding-block:22px;font-size:.82rem;color:var(--muted);border-top:1px solid var(--line)}

@media (max-width:640px){
  .choose{grid-template-columns:minmax(0,1fr)}
  .books{grid-template-columns:minmax(0,1fr)}
  .book{grid-template-columns:72px minmax(0,1fr)}
  .spine{font-size:1.8rem}
}
@media (prefers-reduced-motion:reduce){.lang,.book{transition:none}.lang:hover,.book:hover{transform:none}}
</style>
</head>
<body>

<div class="band" aria-hidden="true"><i></i><i></i><i></i></div>

<section class="landing" id="landing">
  <div class="wrap">
    <svg class="mark" viewBox="0 0 72 72" aria-hidden="true">
      <circle class="g" cx="36" cy="14" r="7"/>
      <path class="g" d="M36 2 l3 6 h-6z"/>
      <rect class="g" x="22" y="26" width="28" height="4"/>
      <rect class="g" x="22" y="58" width="28" height="4"/>
      <rect class="g" x="14" y="26" width="5" height="36"/>
      <rect class="g" x="53" y="26" width="5" height="36"/>
      <circle class="g" cx="36" cy="44" r="9"/>
    </svg>
    <h1>DIT Mongolia Guide<small>DIT ORIGINAL · モンゴル紹介ガイド</small></h1>
    <div class="choose">
      <button class="lang" type="button" data-lang="ja"><b>日本語</b><span>日本語で見る</span></button>
      <button class="lang" type="button" data-lang="en"><b>English</b><span>View in English</span></button>
    </div>
    <p class="hint">言語を選んでください · Choose your language</p>
  </div>
</section>

<section class="menu" id="menu" hidden>
  <div class="wrap">
    <div class="topbar">
      <button class="home" type="button" id="home">DIT Mongolia Guide</button>
      <div class="switch" role="group" aria-label="Language">
        <button type="button" data-lang="ja" aria-pressed="false">日本語</button>
        <button type="button" data-lang="en" aria-pressed="false">English</button>
      </div>
    </div>
    <div>
      <h2 id="m-title"></h2>
      <p class="intro" id="m-intro"></p>
    </div>
    <div class="books" id="books"></div>
  </div>
</section>

<div class="viewer" id="viewer" hidden>
  <div class="vbar">
    <button class="back" type="button" id="v-back"></button>
    <span class="vtitle" id="v-title"></span>
    <button class="vswitch" type="button" id="v-switch"></button>
  </div>
  <iframe id="frame" title=""></iframe>
  <div class="vfoot"></div>
</div>

<footer><div class="wrap">DIT ORIGINAL GUIDE · Mongolia</div></footer>

<script>
(function(){
  var T={
    ja:{title:'モンゴルを、4冊で知る',intro:'見たいガイドを選んでください。どれから読んでも楽しめます。',open:'開く →',back:'← 一覧へ',sw:'English',
      books:[
        {k:'manners',no:'作',tag:'作法とタブー',name:'ゲルの敷居をまたぐ前に',desc:'ゲルの間取り、火と水、もてなしの作法。○×クイズつき。'},
        {k:'guide',no:'裏',tag:'DITオリジナル',name:'載ってないモンゴル',desc:'現地の本音、旅行者の失敗談、暮らしのリアル。黒塗りをめくって読む。'},
        {k:'festivals',no:'祭',tag:'奇祭図鑑',name:'モンゴル奇祭図鑑',desc:'ヤクのロデオからイヌワシ祭まで。クレイジー度と開催月つき。'},
        {k:'japan',no:'比',tag:'文化・歴史',name:'モンゴルと日本',desc:'文化の基本、日本との共通点と相違点、歴史年表。'}
      ]},
    en:{title:'Mongolia in four guides',intro:'Pick a guide to open. Start anywhere you like.',open:'Open →',back:'← All guides',sw:'日本語',
      books:[
        {k:'manners',no:'I',tag:'Etiquette & taboos',name:'Before the Ger Threshold',desc:'Inside a ger, fire and water, hospitality. With a true-or-false quiz.'},
        {k:'guide',no:'II',tag:'DIT Original',name:'Unlisted Mongolia',desc:'Local tricks, traveler mistakes, real life. Tap the blacked-out text to read.'},
        {k:'festivals',no:'III',tag:'Festivals',name:'Mongolia Festival Field Guide',desc:'From yak rodeos to the Golden Eagle Festival, with craziness ratings and dates.'},
        {k:'japan',no:'IV',tag:'Culture & history',name:'Mongolia and Japan',desc:'Culture basics, what the two countries share and don\'t, and a history timeline.'}
      ]}
  };
  var landing=document.getElementById('landing'),menu=document.getElementById('menu'),viewer=document.getElementById('viewer'),
      frame=document.getElementById('frame'),books=document.getElementById('books'),lang='ja',current=null;

  function showMenu(l){
    lang=l;document.documentElement.lang=l;
    var t=T[l];
    document.getElementById('m-title').textContent=t.title;
    document.getElementById('m-intro').textContent=t.intro;
    document.querySelectorAll('.switch button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.lang===l?'true':'false');});
    books.innerHTML=t.books.map(function(b,i){
      return '<button class="book" type="button" data-k="'+b.k+'"><span class="spine s'+(i+1)+'" aria-hidden="true">'+b.no+'</span>'+
        '<span class="txt"><span class="lbl">'+b.tag+'</span><h3>'+b.name+'</h3><p>'+b.desc+'</p><span class="open">'+t.open+'</span></span></button>';
    }).join('');
    books.querySelectorAll('.book').forEach(function(el){el.addEventListener('click',function(){openBook(el.dataset.k);});});
    landing.hidden=true;menu.hidden=false;
    try{localStorage.setItem('dit-lang',l);}catch(e){}
  }
  function openBook(k){
    current=k;var t=T[lang],b=t.books.filter(function(x){return x.k===k;})[0];
    frame.src=lang+'-'+k+'.html';frame.title=b.name;
    document.getElementById('v-title').textContent=b.name;
    document.getElementById('v-back').textContent=t.back;
    document.getElementById('v-switch').textContent=t.sw;
    viewer.hidden=false;document.body.style.overflow='hidden';
  }
  function closeBook(){viewer.hidden=true;frame.src='about:blank';current=null;document.body.style.overflow='';}

  document.querySelectorAll('.lang').forEach(function(b){b.addEventListener('click',function(){showMenu(b.dataset.lang);});});
  document.querySelectorAll('.switch button').forEach(function(b){b.addEventListener('click',function(){showMenu(b.dataset.lang);});});
  document.getElementById('home').addEventListener('click',function(){menu.hidden=true;landing.hidden=false;});
  document.getElementById('v-back').addEventListener('click',closeBook);
  document.getElementById('v-switch').addEventListener('click',function(){var k=current;showMenu(lang==='ja'?'en':'ja');openBook(k);});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!viewer.hidden)closeBook();});

  var h=(location.hash||'').replace('#','');
  if(h==='ja'||h==='en')showMenu(h);
})();
</script>

</body>
</html>
